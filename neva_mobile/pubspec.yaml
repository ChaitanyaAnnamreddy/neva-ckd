name: neva_mobile
description: Neva - Kidney Health Assessment Mobile App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  get: ^4.6.5

  # State Management
  provider: ^6.0.0

  # Firebase (commented out for web testing - uncomment for production)
  # firebase_core: ^2.24.0
  # firebase_auth: ^4.14.0
  # cloud_firestore: ^4.13.0
  # flutter_dotenv: ^5.1.0

